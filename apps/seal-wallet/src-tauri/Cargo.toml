[package]
name = "seal-wallet-app"
description = "Seal Wallet desktop app — Tauri + native Rust crypto"
version = "0.1.0"
edition = "2021"
publish = false

# When Tauri is installed, add:
# [dependencies]
# tauri = { version = "2", features = ["shell-open"] }
# tauri-build = { version = "2", features = [] }

[dependencies]
seal-wallet = { path = "../../../crates/seal-wallet" }
seal-crypto = { path = "../../../crates/seal-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
