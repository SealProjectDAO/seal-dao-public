<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#14141F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2A5A8A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Shield outline -->
  <path d="M256 80 L400 140 L400 280 Q400 380 256 440 Q112 380 112 280 L112 140 Z"
        fill="none" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>
  <!-- S letterform -->
  <path d="M200 200 Q200 170 230 170 L290 170 Q320 170 320 200 Q320 230 290 230 L230 230
           Q200 230 200 260 Q200 290 230 290 L290 290 Q320 290 320 320"
        fill="none" stroke="#4A90D9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lock dot (PQC) -->
  <circle cx="256" cy="370" r="12" fill="#4ADE80"/>
  <!-- Quantum sparkle -->
  <circle cx="340" cy="130" r="4" fill="#4ADE80" opacity="0.6"/>
  <circle cx="172" cy="130" r="3" fill="#4A90D9" opacity="0.4"/>
</svg>
