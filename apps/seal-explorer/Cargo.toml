[package]
name = "seal-explorer"
description = "Seal DAO block explorer GUI"
version = "0.1.0"
edition = "2021"

# Not a workspace member — standalone app with GUI deps
# Build: cd apps/seal-explorer && cargo run

[dependencies]
eframe = "0.29"
seal-crypto = { path = "../../crates/seal-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
