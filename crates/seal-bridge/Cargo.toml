[package]
name = "seal-bridge"
description = "Cross-chain bridge for Solana and Stellar (lock-and-mint)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
seal-crypto = { path = "../seal-crypto" }
seal-token = { path = "../seal-token" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
base64 = "0.22"
# Committee-MAC computation for the unlock path. The on-chain bridge
# programs verify `HMAC-SHA-256(committee_key, payload)` (Solana +
# Stellar both — see `verify_committee_sig` in bridges/solana/programs/
# seal-bridge/src/lib.rs and `verify_proof` in bridges/stellar/src/lib.rs).
# Classical SHA-2 is acceptable here per CLAUDE.md ("classical crypto
# only in bridge modules"); both crates are RustCrypto, vendored.
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# Constant-time equality for committee-key comparison
# (`committee_key_eq`). The host-side persistence-detection path
# calls this once per /metrics scrape; using `==` would leak timing
# on a side-channel-aware attacker scraping aggressively.
subtle = { workspace = true }
# Stellar StrKey base32 decode (G… / C… → 32-byte payload). The
# canonical XDR Address serialization the Soroban bridge contract
# hashes is built from the decoded payload + the SCV_ADDRESS
# discriminant; see `compute_committee_mac` (Chain::Stellar branch).
data-encoding = "2"
# ed25519 for the k-of-n committee member signing path (Solana multisig).
# Each committee member holds an ed25519 keypair whose 32-byte public key is
# a registered entry in `bridge_state.committee_members` on the Solana bridge
# program; the on-chain `unlock_tokens` is authorized by >= `unlock_threshold`
# of these members co-signing the transaction (runtime-verified, zero program
# cost). The node holds the member signing keys to expose the member pubkeys
# (program config) and to produce the Seal-side committee authorization record
# — each member's ed25519 signature over the canonical unlock payload. This is
# the same ed25519 (RFC 8032) Solana transaction signers use. Already vendored
# (ed25519-dalek 2.2.0, via libp2p-identity); classical, so fine in bridge
# modules per CLAUDE.md.
ed25519-dalek = "2.2"

# Ringtail (PQ threshold) signing — only pulled in when the
# `ringtail-singleton` feature is enabled. Opt-in to keep the bridge
# crate's default dep graph lean (the threshold crate brings NTT,
# rand, zeroize, and ~thousands of lines of ring arithmetic that the
# HMAC-SHA-256 default committee-of-1 path doesn't need).
seal-threshold = { path = "../seal-threshold", optional = true }
seal-ringtail-verify = { path = "../seal-ringtail-verify", optional = true }
# tokio::sync::mpsc::Sender for the optional signing-signal channel
# (P1#5 layer 4 trigger — see ADR-002). Kept under the same feature
# so the default-feature build stays tokio-free.
tokio = { workspace = true, optional = true }

# KMS sidecar client — Unix socket implementation of CommitteeSigner
# and RingtailSigner traits. Enables on-demand signing where the key
# never leaves the KMS sidecar.
seal-kms-client = { package = "seal-kms-sidecar", path = "../seal-kms-sidecar", optional = true }

[features]
default = []
# Enables the host-side helper that produces a 1-of-1 Ringtail
# signature shaped to match what the on-chain `ringtail-verify`
# feature expects in `bridges/solana/programs/seal-bridge` and
# `bridges/stellar`. Singleton is the foundational building block
# for the multi-validator path; multi-signer + P2P round 1 / round 2
# coordination is the next layer.
ringtail-singleton = ["dep:seal-threshold", "dep:seal-ringtail-verify", "dep:tokio"]
# KMS sidecar client — Unix socket CommitteeSigner/RingtailSigner
kms-client = ["dep:seal-kms-client", "dep:tokio"]

[dev-dependencies]
proptest = { workspace = true }
