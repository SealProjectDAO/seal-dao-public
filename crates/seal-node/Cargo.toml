[package]
name = "seal-node"
description = "Seal DAO single-node prototype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "seal-node"
path = "src/main.rs"

[dependencies]
seal-crypto = { path = "../seal-crypto" }
seal-merkle = { path = "../seal-merkle" }
seal-sql = { path = "../seal-sql" }
seal-storage = { path = "../seal-storage" }
seal-vrf = { path = "../seal-vrf" }
seal-p2p = { path = "../seal-p2p" }
seal-consensus = { path = "../seal-consensus" }
seal-threshold = { path = "../seal-threshold" }
seal-zk = { path = "../seal-zk" }
seal-mpc = { path = "../seal-mpc" }
seal-token = { path = "../seal-token" }
seal-bridge = { path = "../seal-bridge" }
libp2p = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sled = { workspace = true }
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"
base64 = "0.22"

[features]
default = []
# Pulls in seal-bridge's `ringtail-singleton` feature, plus the
# seal-node-side orchestrator wiring (--bridge-ringtail-* CLI flags,
# Arc<Mutex<RingtailBridgeOrchestrator>> on RpcState, network-loop
# routing). P1#5 layer 4 — see docs/decisions/ADR-002.
ringtail-singleton = ["seal-bridge/ringtail-singleton"]

[dev-dependencies]
tempfile = { workspace = true }
