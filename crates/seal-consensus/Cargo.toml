[package]
name = "seal-consensus"
description = "VRF-based consensus engine for Seal DAO (Algorand-style)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
seal-crypto = { path = "../seal-crypto" }
seal-vrf = { path = "../seal-vrf" }
seal-storage = { path = "../seal-storage" }
seal-token = { path = "../seal-token" }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# `bincode` is a real (not dev) dependency: `SlashingManager::report_offense`
# deserializes the double-proposal header evidence and re-serializes each
# header's canonical (empty-sig) form to verify the proposer's ML-DSA signature.
bincode = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
bincode = { workspace = true }
