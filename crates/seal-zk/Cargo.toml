[package]
name = "seal-zk"
description = "Zero-knowledge proof generation and verification for Seal DAO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Enable RISC Zero backend
risc0 = ["dep:risc0-zkvm"]
# Enable SP1 backend
sp1 = ["dep:sp1-sdk"]
# GPU acceleration backends
gpu-cuda = []    # NVIDIA CUDA (sm_70+)
gpu-rocm = []    # AMD ROCm / HIP (gfx900+)
gpu-metal = []   # Apple Metal (macOS)
gpu-opencl = []  # OpenCL (cross-vendor: NVIDIA, AMD, Intel)

[dependencies]
seal-crypto = { path = "../seal-crypto" }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }

# Optional ZK backends
risc0-zkvm = { workspace = true, optional = true }
sp1-sdk = { workspace = true, optional = true }

[dev-dependencies]
seal-crypto = { path = "../seal-crypto" }
