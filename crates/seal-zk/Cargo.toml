[package]
name = "seal-zk"
description = "Zero-knowledge proof generation and verification for Seal DAO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Enable RISC Zero backend (executor only — fast).
risc0 = ["dep:risc0-zkvm", "dep:risc0-binfmt", "dep:risc0-zkos-v1compat"]
# Opt-in full in-process STARK proving via risc0-zkvm's LocalProver.
# Implies `risc0`. Adds the `prove` feature to risc0-zkvm (heavy deps:
# rayon, gdbstub, etc.) and uses RUST_MIN_STACK=16MB in release.
local-prover = ["risc0", "risc0-zkvm/prove"]
# Enable SP1 backend
sp1 = ["dep:sp1-sdk"]
# GPU acceleration backends.
#
# `gpu-cuda` and `gpu-metal` also activate the corresponding risc0-zkvm
# feature so its STARK prover actually dispatches to the GPU HAL. Build
# host requirements:
#   - gpu-cuda:  CUDA toolkit + NVIDIA driver (Linux/Windows).
#   - gpu-metal: full Xcode with the Metal Toolchain component
#                (`xcodebuild -downloadComponent MetalToolchain`),
#                and DEVELOPER_DIR pointing at Xcode.app.
gpu-cuda = []    # NVIDIA CUDA — activation: `risc0-zkvm/cuda` must be
                 # enabled at the top-level cargo command (adds cust dep).
gpu-metal = ["local-prover"]  # Apple Metal — activation: pass
                              # `--features risc0-zkvm/metal` too.
gpu-rocm = []    # AMD ROCm / HIP (gfx900+)
gpu-opencl = []  # OpenCL (cross-vendor: NVIDIA, AMD, Intel)

[dependencies]
seal-crypto = { path = "../seal-crypto" }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }

# Optional ZK backends
risc0-zkvm = { workspace = true, optional = true }
risc0-binfmt = { version = "5.0.0-rc.1", optional = true }
risc0-zkos-v1compat = { version = "5.0.0-rc.1", optional = true }
sp1-sdk = { workspace = true, optional = true }

[dev-dependencies]
seal-crypto = { path = "../seal-crypto" }
