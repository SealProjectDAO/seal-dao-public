[workspace]

[package]
name = "seal-zk-guest"
version = "0.1.0"
edition = "2021"
description = "RISC Zero guest program for Seal DAO state transition proofs"

[features]
default = []

[dependencies]
# risc0-zkvm-platform is the bare syscall/entry layer.
# NOTE: a valid journal commitment at sys_halt requires the Output-digest
# machinery in risc0-zkvm's full guest env, which currently can't be pulled
# into a pure -Zbuild-std build without the cargo-risczero v5 shim.
# Until that ships, the guest produces a stub out_state and real proving
# requires either docker or cargo-risczero v5.
risc0-zkvm-platform = { version = "5.0.0-rc.1", default-features = false, features = [
    "panic-handler",
    "entrypoint",
    "rust-runtime",
] }

# Native-only deps (for testing without zkVM)
[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
