[package]
name = "seal-token"
description = "SEAL token economics: balances, transfers, staking, burn-and-mint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
seal-crypto = { path = "../seal-crypto" }
serde = { workspace = true }
thiserror = { workspace = true }
# bincode 1 — used by `BalanceStore::state_root_hash` to serialize
# Balance values into the HAMT for the content-addressed root.
bincode = { workspace = true }
# tracing — a corrupt balance leaf (a module bug, or a hand-crafted leaf)
# is logged as a warning rather than panicking; see `decode_balance`.
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
