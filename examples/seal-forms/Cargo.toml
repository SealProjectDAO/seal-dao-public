[package]
name = "seal-forms"
version = "0.1.0"
edition = "2021"
description = "forms.seal — encrypted surveys with iterated-hash answer traces (demo app, see TODO.md)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "seal-forms"
path = "src/main.rs"

[dependencies]
seal-crypto = { path = "../../crates/seal-crypto" }
seal-sql = { path = "../../crates/seal-sql" }
seal-wallet = { path = "../../crates/seal-wallet" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
# Real AEAD (replaces the old XOR-stream + bespoke HMAC wrapper).
# AES-256-GCM provides confidentiality + authenticity in one
# primitive; HKDF-SHA3-256 derives the symmetric key from the
# ML-KEM shared secret with a domain-separator info string.
aes-gcm = "0.10"
hkdf = "0.12"
sha3 = "0.10"
