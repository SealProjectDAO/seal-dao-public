global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'seal-node'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8545']
        labels:
          instance: 'local-node'

