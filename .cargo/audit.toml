[advisories]
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack (rsa 0.9.10 timing sidechannel).
    # Transitive via rzup → risc0-zkvm → seal-zk. No fixed upgrade is
    # available upstream. We do not use RSA for any Seal DAO protocol
    # operation; it appears only in the risc0 toolchain installer path.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2025-0055: tracing-subscriber 0.2.25 ANSI-escape log
    # poisoning. Transitive via ark-relations 0.5.1 → ark-groth16 →
    # risc0-groth16 → seal-zk. Pinned by arkworks 0.5; cannot bump
    # without an arkworks release. We do not feed untrusted input
    # into the arkworks tracing subscriber in any Seal code path.
    "RUSTSEC-2025-0055",

    # RUSTSEC-2026-0119: hickory-proto 0.25.2 — O(n²) CPU exhaustion
    # during DNS message *encoding* via deeply-nested name
    # compression. Fixed in >=0.26.1, but our pin comes from
    # libp2p-mdns 0.48.0 (which hard-pins `hickory-proto = "0.25.2"`)
    # and libp2p-dns 0.44.0 — bumping requires a libp2p-mdns/-dns
    # vendor refresh that no upstream release has yet matched (the
    # libp2p 0.56 family is the latest and still pins 0.25.2). The
    # bug is reachable only when *encoding* attacker-controlled DNS
    # names, not decoding. Seal's encoding sites are: (a) our own
    # mDNS service records (peer ID + port — operator-controlled),
    # (b) outbound DNS queries to operator-configured bootnode
    # hostnames. Neither path takes attacker input. Tracked in
    # TODOS.md as a follow-up to the rustls-webpki refresh; bump
    # alongside libp2p-mdns 0.49+ when available.
    "RUSTSEC-2026-0119",

    # RUSTSEC-2026-0118: hickory-proto 0.25.2 — NSEC3 closest-encloser
    # proof validation enters an unbounded loop on cross-zone
    # responses. **No fixed upgrade is available** as of 2026-05-07.
    # Same dependency chain as RUSTSEC-2026-0119 (libp2p-mdns /
    # libp2p-dns). Reachable only if the libp2p resolver follows
    # DNSSEC against an attacker-controlled zone; Seal does not
    # enable DNSSEC validation on the libp2p-dns transport in any
    # `NodeConfig`, and bootnode hostnames are operator-configured
    # (operator-trust assumption). Re-evaluate when an upstream fix
    # ships; tracked alongside RUSTSEC-2026-0119 in TODOS.md.
    "RUSTSEC-2026-0118",
]
