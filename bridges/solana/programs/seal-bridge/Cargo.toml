[package]
name = "seal-bridge"
version = "0.1.0"
description = "Seal DAO <-> Solana bridge program (Anchor)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "seal_bridge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

# Required by anchor 0.31 to generate the program's IDL during build.
# Without this feature the build fails with "idl-build feature is
# missing" on `anchor build`.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Anchor 0.31.x brings in a newer solana-program stack whose blake3
# pulls constant_time_eq ^0.4 — which builds on Solana's shipped
# rustc 1.89. Staying on 0.30 pinned the old solana-program 1.18.26
# whose blake3 needed `constant_time_eq = "^0.4.2"` — but the 0.4.x
# series requires rustc 1.95 (beyond Solana's bundled compiler),
# creating a no-build corner. The 0.31 line resolves it.
anchor-lang = "0.31"
anchor-spl = "0.31"

# NOTE: no classic-crypto dependencies. Committee authorization is a
# k-of-n member multisig verified natively by the Solana runtime
# (tx signer verification), so the program itself performs no
# signature checks. The earlier ed25519-dalek / HMAC / Ringtail
# in-BPF verify paths were removed after measurement showed ed25519
# verification exceeds this runtime's 1.4M CU per-instruction cap and
# the ed25519 precompile cannot be bound to on-chain committee keys
# (see module doc in src/lib.rs).
