[package]
name = "seal-bridge-stellar"
version = "0.1.0"
description = "Seal DAO <-> Stellar bridge contract (Soroban)"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []

# Algebraic Ringtail verify on Soroban.
#
# Same feature flag semantics as the Solana bridge's `ringtail-verify`:
# when ON, unlock_xlm stacks an algebraic Ringtail verify on top of
# the existing committee-MAC check. Currently gated because:
#   (1) Soroban WASM module size / instruction cost needs measurement
#       (expected ~10M instructions per verify, within the 100M budget
#       but worth confirming before enabling).
#   (2) seal-threshold's signer has a known inconsistency with
#       verify_signature_full. Separate track.
# Keep OFF for default testnet/mainnet-initial builds.
# `seal-ringtail-verify` is `no_std + alloc`; enabling it on a Soroban
# contract requires a global allocator. soroban-sdk 22 ships a bump
# allocator behind its `alloc` feature — turn it on here or the WASM
# link step fails with "no global memory allocator found".
ringtail-verify = ["dep:seal-ringtail-verify", "soroban-sdk/alloc"]

[dependencies]
# 22.x is pinned to match the installed stellar-cli 22.0.0. SDK 21's
# `symbol_short!` expanded identifier constants at macro time; 22 now
# requires string literals, so the previous `symbol_short!(ADMIN_KEY)`
# pattern needs to become `symbol_short!("admin")` — see src/lib.rs.
soroban-sdk = "22"

# no_std-compatible Ringtail verifier. Optional until Soroban
# instruction-cost and signer-fix blockers are cleared.
seal-ringtail-verify = { path = "../../crates/seal-ringtail-verify", optional = true }

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
